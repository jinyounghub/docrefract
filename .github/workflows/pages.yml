name: Live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build demo report
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore DocRefract.slnx --locked-mode

      - name: Build live demo
        run: >
          dotnet run
          --project src/DocRefract.Cli/DocRefract.Cli.csproj
          --configuration Release
          --no-restore
          --
          demo
          --out artifacts/site/report

      - name: Assemble landing site
        shell: pwsh
        run: |
          $assets = "artifacts/site/assets"
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          Copy-Item -LiteralPath "docs/site/index.html" -Destination "artifacts/site/index.html"
          Copy-Item -LiteralPath "docs/site/sitemap.xml" -Destination "artifacts/site/sitemap.xml"
          Copy-Item -LiteralPath "docs/site/47097ce915504765a682bf02229d4fd3.txt" -Destination "artifacts/site/47097ce915504765a682bf02229d4fd3.txt"
          Copy-Item -LiteralPath "docs/assets/report-preview.png" -Destination $assets
          Copy-Item -LiteralPath "docs/assets/docrefract-icon.png" -Destination $assets
          Copy-Item -LiteralPath "docs/assets/social-preview.png" -Destination $assets

      - name: Verify deployable site
        shell: pwsh
        run: |
          $required = @(
            "index.html",
            "sitemap.xml",
            "47097ce915504765a682bf02229d4fd3.txt",
            "assets/report-preview.png",
            "assets/docrefract-icon.png",
            "assets/social-preview.png",
            "report/index.html",
            "report/diff.json"
          )
          foreach ($name in $required) {
            $path = Join-Path "artifacts/site" $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Live demo site did not produce $name."
            }
          }

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/site

  deploy:
    name: Deploy live demo
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  notify-indexnow:
    name: Notify search engines
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Submit updated Pages URLs to IndexNow
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $siteUrl = "https://jinyounghub.github.io/docrefract/"
          $key = "47097ce915504765a682bf02229d4fd3"
          $keyLocation = "${siteUrl}${key}.txt"
          $payload = @{
            host = "jinyounghub.github.io"
            key = $key
            keyLocation = $keyLocation
            urlList = @(
              $siteUrl
              "${siteUrl}report/"
            )
          } | ConvertTo-Json

          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              $keyResponse = Invoke-WebRequest -Uri $keyLocation -UseBasicParsing
              if ($keyResponse.Content.Trim() -ne $key) {
                throw "The deployed IndexNow key did not match."
              }
              break
            }
            catch {
              if ($attempt -eq 5) { throw }
              Write-Warning "IndexNow key is not available yet (attempt $attempt/5)."
              Start-Sleep -Seconds 5
            }
          }

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              $response = Invoke-WebRequest `
                -Uri "https://api.indexnow.org/indexnow" `
                -Method Post `
                -ContentType "application/json; charset=utf-8" `
                -Body $payload `
                -UseBasicParsing

              if ([int]$response.StatusCode -notin 200, 202) {
                throw "IndexNow returned HTTP $($response.StatusCode)."
              }
              Write-Host "IndexNow accepted the updated URLs with HTTP $($response.StatusCode)."
              break
            }
            catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "IndexNow submission failed (attempt $attempt/3): $($_.Exception.Message)"
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
